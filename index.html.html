<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>작은 모험가 - 전투 확장판</title>
<style>
:root{color-scheme:dark;--panel:#17251f;--line:#547565;--gold:#ffd66b}
*{box-sizing:border-box}
body{margin:0;background:#101813;color:#f3f5df;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center}
.game{width:min(100%,720px);min-height:100dvh;padding:12px;display:flex;flex-direction:column;gap:10px}
h1{margin:2px 0 0;font-size:22px;letter-spacing:1px}.sub{color:#b8cbbd;font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{border:2px solid var(--line);background:var(--panel);border-radius:8px;padding:9px}
.statline{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.bar{height:10px;border:1px solid #8fa99a;background:#26352d;margin-top:5px;border-radius:3px;overflow:hidden}
.fill{height:100%;width:100%;background:#e65e67;transition:width .15s}#xpFill{background:#69b8f2}#enemyFill{background:#ef8e54}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:3px solid #547565;border-radius:8px;background:#5d9a54;touch-action:none}
.row{display:flex;gap:8px;align-items:stretch}.row>*{flex:1}
button,select{border:2px solid #739783;border-radius:8px;background:#24392e;color:#fff8df;padding:11px 8px;font-size:14px;font-weight:700;touch-action:manipulation}
button:active{transform:translateY(1px);background:#385744}button:disabled{opacity:.42}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:280px;margin:auto;width:100%}
.controls button{font-size:20px;padding:12px 0;min-height:48px}.blank{visibility:hidden}
.tiny{font-size:11px;color:#afc5b6;text-align:center}
#log{min-height:66px;font-size:13px;line-height:1.45;color:#dcebdc}
.skillgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.skillgrid button{font-size:12px;padding:10px 5px;min-height:62px}
.label{font-size:12px;color:#c4d9c9;margin-bottom:5px;display:block}
select{width:100%;font-size:14px}
@media(max-width:380px){.game{padding:8px}.stats{gap:6px}.panel{padding:7px}.row{gap:5px}.row button{font-size:12px;padding:10px 4px}}
</style>
</head>
<body>
<main class="game">
  <div><h1>🗡️ 작은 모험가</h1><div class="sub">모바일 픽셀 RPG · 전투 확장판</div></div>
  <section class="panel">
    <label class="label" for="jobSelect">직업 선택 (게임 시작 전 언제든 변경 가능)</label>
    <div class="row">
      <select id="jobSelect">
        <option value="warrior">⚔️ 전사 — 높은 체력과 강한 일격</option>
        <option value="mage">🔮 마법사 — 강력한 마법 공격</option>
        <option value="knight">🛡️ 성기사 — 방어와 회복에 특화</option>
      </select>
      <button id="jobBtn">직업 적용</button>
    </div>
    <div class="sub" id="jobDescription" style="margin-top:7px">튼튼한 체력과 안정적인 근접 전투.</div>
  </section>
  <section class="stats">
    <div class="panel">
      <div class="statline"><b>모험가 Lv.<span id="level">1</span></b><span>❤️ <span id="hpText">36/36</span></span></div>
      <div class="bar"><div class="fill" id="hpFill"></div></div>
      <div class="statline" style="margin-top:7px"><span>경험치</span><span id="xpText">0/10</span></div>
      <div class="bar"><div class="fill" id="xpFill" style="width:0%"></div></div>
    </div>
    <div class="panel">
      <div class="statline"><b>🪙 골드</b><b id="gold">0</b></div>
      <div class="statline" style="margin-top:7px"><span>⚔️ 공격력</span><b id="atk">6</b></div>
      <div class="statline" style="margin-top:7px"><span>🛡️ 방어력</span><b id="def">1</b></div>
      <div class="statline" style="margin-top:7px"><span>💧 MP</span><b id="mpText">12/12</b></div>
      <div class="statline" style="margin-top:7px"><span>🧪 물약</span><b id="potions">2</b></div>
      <button id="potionBtn" style="width:100%;margin-top:8px;padding:8px;font-size:12px">물약 사용 (+12 HP)</button>
    </div>
  </section>
  <section class="panel" id="enemyPanel">
    <div class="statline"><b id="enemyName">🟢 숲 슬라임</b><b id="enemyHpText">12/12 HP</b></div>
    <div class="bar"><div class="fill" id="enemyFill"></div></div>
  </section>
  <canvas id="world" width="320" height="240" aria-label="픽셀 RPG 필드"></canvas>
  <div class="tiny">방향 버튼으로 이동 · 적 가까이에서 공격 또는 스킬 사용</div>
  <section class="controls" aria-label="이동 조작">
    <span class="blank"></span><button data-move="up" aria-label="위로 이동">▲</button><span class="blank"></span>
    <button data-move="left" aria-label="왼쪽 이동">◀</button><button data-move="down" aria-label="아래로 이동">▼</button><button data-move="right" aria-label="오른쪽 이동">▶</button>
  </section>
  <div class="row"><button id="attackBtn">⚔️ 기본 공격</button><button id="restBtn">⛺ 휴식 (+8 HP)</button><button id="newBtn">↻ 다시 시작</button></div>
  <section class="panel">
    <b>✨ 직업 스킬</b>
    <div class="skillgrid" style="margin-top:8px">
      <button id="skill1">💥 강타<br><small>MP 3</small></button>
      <button id="skill2">🌟 직업 스킬<br><small>MP 4</small></button>
      <button id="skill3">🌀 필살기<br><small>MP 7</small></button>
    </div>
    <div class="sub" id="skillHint" style="margin-top:7px">직업에 따라 스킬 효과가 달라져.</div>
  </section>
  <section class="panel"><b>모험 기록</b><div id="log" aria-live="polite">직업을 선택하고 숲 슬라임에게 다가가 전투를 시작하자.</div></section>
  <div class="tiny">보스는 일반 몬스터를 3마리 처치하면 등장해. 이 버전의 진행 상황은 새로고침하면 초기화돼.</div>
</main>
<script>
(() => {
'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const jobs={
 warrior:{name:'전사',desc:'체력과 공격력이 높다. 강타가 더 강력하다.',hp:36,atk:6,def:1,mp:12,skills:['💥 강타','🪓 회전베기','🔥 분노의 일격']},
 mage:{name:'마법사',desc:'기본 체력은 낮지만 스킬 피해가 강력하다.',hp:26,atk:5,def:0,mp:18,skills:['💥 비전탄','❄️ 얼음창','☄️ 운석 낙하']},
 knight:{name:'성기사',desc:'방어력이 높다. 직업 스킬로 체력을 회복한다.',hp:34,atk:5,def:3,mp:14,skills:['💥 방패 강타','✨ 신성한 치유','⚡ 심판의 빛']}
};
const state={x:64,y:120,level:1,hp:36,maxHp:36,xp:0,nextXp:10,gold:0,atk:6,def:1,mp:12,maxMp:12,potions:2,job:'warrior',kills:0,enemy:null,gameOver:false,busy:false,bossDefeated:false};
let seed=47;function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}
const tiles=[];for(let i=0;i<150;i++)tiles.push({x:Math.floor(rand()*320),y:Math.floor(rand()*240),type:Math.floor(rand()*3)});
function log(s){$('log').textContent=s;}
function makeEnemy(boss=false){
 const level=state.level;
 state.enemy=boss?{name:'👹 숲의 고블린 왕',boss:true,x:220,y:120,hp:65+level*8,maxHp:65+level*8,atk:8+level,alive:true}
 :{name:'🟢 숲 슬라임',boss:false,x:55+Math.floor(rand()*210),y:65+Math.floor(rand()*95),hp:12+level*3,maxHp:12+level*3,atk:3+Math.floor(level/2),alive:true};
}
function applyJob(job,initial=false){
 const oldMax=state.maxHp,oldHp=state.hp;state.job=job;const j=jobs[job];
 state.maxHp=j.hp+(state.level-1)*5;state.atk=j.atk+(state.level-1)*2;state.def=j.def+Math.floor((state.level-1)/2);
 state.maxMp=j.mp+(state.level-1)*2;state.hp=initial?state.maxHp:Math.min(state.maxHp,oldHp+(state.maxHp-oldMax));state.mp=initial?state.maxMp:Math.min(state.maxMp,state.mp);
 $('jobDescription').textContent=j.desc;$('skill1').innerHTML=j.skills[0]+'<br><small>MP 3</small>';$('skill2').innerHTML=j.skills[1]+'<br><small>MP 4</small>';$('skill3').innerHTML=j.skills[2]+'<br><small>MP 7</small>';
 $('skillHint').textContent=job==='knight'?'성기사의 두 번째 스킬은 적을 공격하면서 HP도 회복해.':job==='mage'?'마법사는 스킬 피해가 높지만 방어력이 낮아.':'전사는 기본 공격과 강타에 강해.';
 render();
}
function updateUI(){
 $('level').textContent=state.level;$('hpText').textContent=state.hp+'/'+state.maxHp;$('hpFill').style.width=(state.hp/state.maxHp*100)+'%';
 $('xpText').textContent=state.xp+'/'+state.nextXp;$('xpFill').style.width=(state.xp/state.nextXp*100)+'%';
 $('gold').textContent=state.gold;$('atk').textContent=state.atk;$('def').textContent=state.def;$('mpText').textContent=state.mp+'/'+state.maxMp;$('potions').textContent=state.potions;
 $('potionBtn').disabled=state.potions<=0||state.hp===state.maxHp||state.gameOver;
 ['attackBtn','restBtn','skill1','skill2','skill3'].forEach(id=>$(id).disabled=state.gameOver||state.busy);
 if(state.enemy){$('enemyName').textContent=state.enemy.name;$('enemyHpText').textContent=state.enemy.alive?state.enemy.hp+'/'+state.enemy.maxHp+' HP':'처치 완료';$('enemyFill').style.width=(state.enemy.alive?Math.max(0,state.enemy.hp/state.enemy.maxHp*100):0)+'%';}
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function drawHero(x,y){
 rect(x-5,y-12,10,5,'#563c2d');rect(x-4,y-16,8,6,'#e7b98a');rect(x-5,y-17,10,3,'#4a3025');
 rect(x-4,y-9,8,7,state.job==='mage'?'#7652b8':state.job==='knight'?'#c5cbd4':'#3c6ec4');
 rect(x-5,y-3,4,6,'#49382c');rect(x+1,y-3,4,6,'#49382c');
 rect(x+5,y-8,3,9,state.job==='mage'?'#b9a2ff':'#d9dfe5');rect(x+6,y-10,2,3,'#f3f3e8');
 if(state.job==='knight')rect(x-8,y-8,3,8,'#8ca8b5');
}
function drawSlime(e){
 if(!e||!e.alive)return;const x=e.x,y=e.y;
 if(e.boss){rect(x-19,y-5,38,14,'#5a245e');rect(x-16,y-14,32,12,'#873a88');rect(x-11,y-19,22,7,'#873a88');rect(x-10,y-6,4,4,'#ffdf72');rect(x+6,y-6,4,4,'#ffdf72');rect(x-7,y-18,4,3,'#fff0b5');rect(x+4,y-18,4,3,'#fff0b5');rect(x-14,y-24,7,5,'#c9c7d1');rect(x+7,y-24,7,5,'#c9c7d1');}
 else{rect(x-12,y-4,24,10,'#27764c');rect(x-10,y-9,20,6,'#43c86b');rect(x-7,y-12,14,4,'#43c86b');rect(x-6,y-5,3,3,'#102b20');rect(x+3,y-5,3,3,'#102b20');}
 rect(x-(e.boss?20:13),y-30,e.boss?40:26,5,'#352b2a');rect(x-(e.boss?19:12),y-29,(e.boss?38:24)*Math.max(0,e.hp/e.maxHp),3,e.boss?'#c34ee2':'#ff7377');
}
function draw(){
 rect(0,0,320,240,'#72b85d');for(const t of tiles)rect(t.x,t.y,2,2,['#5fa84f','#82c967','#6aae56'][t.type]);
 ctx.fillStyle='#c4aa70';ctx.fillRect(0,181,320,28);for(let i=0;i<18;i++)rect((i*37)%320,185+(i%3)*7,3,2,'#b0965e');
 rect(22,42,18,12,'#357d42');rect(26,34,10,10,'#428d45');rect(28,53,6,10,'#795638');rect(270,42,22,13,'#357d42');rect(275,34,12,10,'#428d45');rect(278,54,6,10,'#795638');
 drawSlime(state.enemy);drawHero(state.x,state.y);ctx.fillStyle='#183021';ctx.font='8px monospace';ctx.fillText(state.enemy&&state.enemy.boss?'BOSS AREA':'PIXEL FOREST',8,12);
 if(state.gameOver){rect(40,88,240,56,'#18251f');ctx.strokeStyle='#e9d88d';ctx.strokeRect(40,88,240,56);ctx.fillStyle='#fff0bc';ctx.font='bold 13px monospace';ctx.fillText(state.bossDefeated?'BOSS DEFEATED!':'YOU FAINTED!',state.bossDefeated?92:105,111);ctx.font='9px monospace';ctx.fillText('Tap "다시 시작" to play again',73,128);}
}
function render(){draw();updateUI();}
function move(dx,dy){if(state.gameOver||state.busy)return;state.x=Math.max(12,Math.min(308,state.x+dx));state.y=Math.max(22,Math.min(222,state.y+dy));if(state.enemy&&state.enemy.alive&&Math.hypot(state.x-state.enemy.x,state.y-state.enemy.y)<50)log(state.enemy.boss?'보스가 눈앞에 있다! 스킬을 활용하자!':'적이 가까이 있다! 공격하거나 스킬을 사용하자.');render();}
function enemyTurn(){
 if(!state.enemy||!state.enemy.alive||state.gameOver)return;
 const damage=Math.max(1,state.enemy.atk-state.def);state.hp=Math.max(0,state.hp-damage);
 if(state.hp<=0){state.gameOver=true;log('쓰러졌다… 다시 시작 버튼을 눌러 재도전하자.');}
 else log((state.enemy.boss?'보스':'몬스터')+'의 반격! '+damage+' 피해를 받았다.');
 render();
}
function levelCheck(){
 while(state.xp>=state.nextXp){state.xp-=state.nextXp;state.level++;state.nextXp+=8;state.maxHp+=5;state.hp=state.maxHp;state.atk+=2;state.maxMp+=2;state.mp=state.maxMp;state.def=Math.floor(state.def+0.5);log('레벨 업! Lv.'+state.level+' · 능력치 상승 및 HP/MP 회복!');}
}
function winEnemy(){
 const e=state.enemy;state.kills++;state.xp+=e.boss?30:6;state.gold+=e.boss?35:3+Math.floor(rand()*5);
 log(e.boss?'보스 격파! 경험치 +30, 골드 +35를 얻었다!':'적 처치! 경험치 +6, 골드를 얻었다.');
 if(e.boss){state.bossDefeated=true;state.gameOver=true;log('🎉 숲의 고블린 왕을 물리쳤다! 체험판 클리어! 다시 시작해 다른 직업도 시험해 보자.');}
 else{levelCheck();if(state.kills%3===0){makeEnemy(true);log('⚠️ 보스 등장! 숲의 고블린 왕이 나타났다!');}else{makeEnemy(false);}}
 render();
}
function doAttack(multiplier=1,mpCost=0,skillName='기본 공격',heal=0){
 if(state.gameOver||state.busy)return;
 if(!state.enemy||!state.enemy.alive){log('공격할 적이 없다.');return;}
 if(Math.hypot(state.x-state.enemy.x,state.y-state.enemy.y)>52){log('적이 너무 멀다! 방향 버튼으로 가까이 가자.');return;}
 if(state.mp<mpCost){log('MP가 부족하다. 휴식하거나 기본 공격으로 전투를 이어가자.');return;}
 state.mp-=mpCost;
 let damage=Math.max(1,Math.floor(state.atk*multiplier)+Math.floor(rand()*3));
 if(state.job==='mage'&&mpCost>0)damage+=4;
 if(state.job==='warrior'&&skillName!=='기본 공격'&&mpCost>0)damage+=2;
 state.enemy.hp-=damage;
 if(heal>0){const healed=Math.min(heal,state.maxHp-state.hp);state.hp+=healed;}
 if(state.enemy.hp<=0){state.enemy.hp=0;winEnemy();return;}
 log(skillName+'! '+damage+' 피해'+(heal>0?' · HP 회복 효과 발동':'')+'을 줬다.');
 enemyTurn();
}
function skill(which){
 const job=state.job;
 if(which===1)doAttack(job==='mage'?2.0:job==='warrior'?2.2:1.8,3,jobs[job].skills[0]);
 if(which===2){if(job==='knight'){if(state.gameOver||state.busy)return;if(!state.enemy||!state.enemy.alive||Math.hypot(state.x-state.enemy.x,state.y-state.enemy.y)>52){log('적 가까이에서 신성한 치유를 사용하자.');return;}doAttack(1.35,4,jobs[job].skills[1],10);}
 else doAttack(job==='mage'?2.8:job==='warrior'?1.7:2.0,4,jobs[job].skills[1]);}
 if(which===3)doAttack(job==='mage'?4.0:job==='warrior'?3.2:2.8,7,jobs[job].skills[2]);
}
function potion(){if(state.potions<=0||state.hp===state.maxHp||state.gameOver)return;const healed=Math.min(12,state.maxHp-state.hp);state.hp+=healed;state.potions--;log('물약을 사용해 HP '+healed+' 회복!');render();}
function rest(){if(state.gameOver)return;const hp=Math.min(8,state.maxHp-state.hp),mp=Math.min(4,state.maxMp-state.mp);if(hp===0&&mp===0){log('이미 HP와 MP가 충분하다.');return;}state.hp+=hp;state.mp+=mp;log('휴식으로 HP '+hp+', MP '+mp+' 회복! (적의 반격은 없음)');render();}
function reset(){
 Object.assign(state,{x:64,y:120,level:1,hp:36,maxHp:36,xp:0,nextXp:10,gold:0,atk:6,def:1,mp:12,maxMp:12,potions:2,job:'warrior',kills:0,gameOver:false,busy:false,bossDefeated:false});
 seed=47;$('jobSelect').value='warrior';applyJob('warrior',true);makeEnemy(false);log('직업을 선택하고 숲 슬라임에게 다가가 전투를 시작하자.');render();
}
document.querySelectorAll('[data-move]').forEach(btn=>{const dirs={up:[0,-12],down:[0,12],left:[-12,0],right:[12,0]};btn.addEventListener('click',()=>move(...dirs[btn.dataset.move]));});
$('attackBtn').addEventListener('click',()=>doAttack());$('skill1').addEventListener('click',()=>skill(1));$('skill2').addEventListener('click',()=>skill(2));$('skill3').addEventListener('click',()=>skill(3));
$('potionBtn').addEventListener('click',potion);$('restBtn').addEventListener('click',rest);$('newBtn').addEventListener('click',reset);
$('jobBtn').addEventListener('click',()=>{if(state.kills>0){log('직업 변경은 다시 시작한 뒤 진행할 수 있어.');return;}applyJob($('jobSelect').value);makeEnemy(false);log(jobs[state.job].name+'로 모험을 시작한다!');render();});
applyJob('warrior',true);makeEnemy(false);render();
})();
</script>
</body>
</html>
